services:
  Lumina-PDF:
    build:
      context: ../..
      dockerfile: docker/embedded/Dockerfile.fat
    container_name: Lumina-PDF-fat
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080$${SYSTEM_ROOTURIPATH:-''}/api/v1/info/status | grep -q 'UP'"]
      interval: 5s
      timeout: 10s
      retries: 16
    ports:
      - "8080:8080"
    volumes:
      - ../../lumina/latest/data:/usr/share/tessdata:rw
      - ../../lumina/latest/config:/configs:rw
      - ../../lumina/latest/logs:/logs:rw
    environment:
      DISABLE_ADDITIONAL_FEATURES: "false"
      SECURITY_ENABLELOGIN: "false"
      FAT_DOCKER: "true"
      SYSTEM_DEFAULTLOCALE: en-US
      UI_APPNAME: Lumina-PDF
      UI_HOMEDESCRIPTION: Full-featured Lumina-PDF with all capabilities
      UI_APPNAMENAVBAR: Lumina-PDF Fat
      SYSTEM_MAXFILESIZE: "200"
      METRICS_ENABLED: "true"
      SYSTEM_GOOGLEVISIBILITY: "true"
      SHOW_SURVEY: "true"
    networks:
      - lumina-network

networks:
  lumina-network:
    driver: bridge

volumes:
  lumina-data:
  lumina-config:
  lumina-logs:
