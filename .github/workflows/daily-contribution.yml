name: Daily Contribution Bot

on:
  schedule:
    - cron: "30 23 * * *" # Runs at 23:30 UTC daily
  workflow_dispatch:      # Allows manual execution for testing
    inputs:
      git_author_name:
        description: "Git Author Name (defaults to your GitHub username)"
        required: false
        default: ""
      git_author_email:
        description: "Git Author Email (defaults to username@users.noreply.github.com)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  make-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Git Author
        run: |
          GIT_NAME="${{ github.event.inputs.git_author_name }}"
          GIT_EMAIL="${{ github.event.inputs.git_author_email }}"
          
          if [ -z "$GIT_NAME" ]; then
            GIT_NAME="${{ github.actor }}"
          fi
          
          if [ -z "$GIT_EMAIL" ]; then
            GIT_EMAIL="${{ github.actor }}@users.noreply.github.com"
          fi
          
          echo "Setting Git User Name: $GIT_NAME"
          echo "Setting Git User Email: $GIT_EMAIL"
          
          git config --global user.name "$GIT_NAME"
          git config --global user.email "$GIT_EMAIL"
        shell: bash

      - name: Generate Random Commits
        run: |
          # Generate a random number between 7 and 15
          NUM_COMMITS=$(( ( RANDOM % 9 ) + 7 ))
          echo "Generating $NUM_COMMITS contribution commits today..."

          for ((i=1; i<=NUM_COMMITS; i++))
          do
            # Append timestamp to the heartbeat file
            echo "- Heartbeat commit $i/$NUM_COMMITS at $(date -u)" >> .github/daily-heartbeat.txt
            git add .github/daily-heartbeat.txt
            
            # Commit with [skip ci] to avoid triggering other heavy pipelines
            git commit -m "chore(contrib): daily contribution heartbeat $i of $NUM_COMMITS [skip ci]"
            
            # Sleep 1 second to ensure distinct commit timestamps
            sleep 1
          done
        shell: bash

      - name: Push Commits
        run: |
          git push origin HEAD:main
        shell: bash
