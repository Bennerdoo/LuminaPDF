services:
  lumina-pdf:
    build:
      context: ../..
      dockerfile: docker/embedded/Dockerfile
    container_name: Lumina-PDF-Security-with-login
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080$${SYSTEM_ROOTURIPATH:-''}/api/v1/info/status | grep -q 'UP'"]
      interval: 5s
      timeout: 10s
      retries: 16
    ports:
      - "8080:8080"
    volumes:
      - ../../lumina/latest/data:/usr/share/tessdata:rw
      - ../../lumina/latest/config:/configs:rw
      - ../../lumina/latest/logs:/logs:rw
    environment:
      DISABLE_ADDITIONAL_FEATURES: "false"
      DOCKER_ENABLE_SECURITY: "true"
      SECURITY_ENABLELOGIN: "true"
      SECURITY_INITIALLOGIN_USERNAME: "admin"
      SECURITY_INITIALLOGIN_PASSWORD: "lumina"
      SYSTEM_DEFAULTLOCALE: en-US
      UI_APPNAME: Lumina-PDF
      UI_HOMEDESCRIPTION: Demo site for Lumina-PDF Latest with Security and Login
      UI_APPNAMENAVBAR: Lumina-PDF Latest
      SYSTEM_MAXFILESIZE: "100"
      METRICS_ENABLED: "true"
      SYSTEM_GOOGLEVISIBILITY: "true"
      SECURITY_CUSTOMGLOBALAPIKEY: "123456789"
      SHOW_SURVEY: "true"
    networks:
      - lumina-network

networks:
  lumina-network:
    driver: bridge

volumes:
  lumina-data:
  lumina-config:
  lumina-logs:
